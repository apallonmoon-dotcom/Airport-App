<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airport Advertising Hub</title>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Telegram Dynamic Theme Vars with Fallbacks */
            --tg-bg-color: #ffffff;
            --tg-text-color: #1a1a1a;
            --tg-hint-color: #8e8e93;
            --tg-button-color: #007aff;
            --tg-button-text-color: #ffffff;

            /* Zones */
            --zone-a: #007bff;
            --zone-b: #6f42c1;
            --zone-c: #20c997;
            
            --map-scale: 1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--tg-bg-color);
            color: var(--tg-text-color);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. Map Viewport Engine */
        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            touch-action: none;
            background-color: #e9ecef;
            background-image: radial-gradient(#ced4da 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        #map-container {
            width: 2000px;
            height: 1125px;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            will-change: transform;
        }

        #map-img {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        /* Interactive Pins */
        .pin {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
            cursor: pointer;
            z-index: 10;
            transform: translate(-50%, -50%) scale(calc(1 / var(--map-scale)));
            transition: box-shadow 0.2s ease;
        }

        .pin.active {
            box-shadow: 0 0 0 calc(4px / var(--map-scale)) #ffffff, 0 0 20px rgba(0,0,0,0.6);
            z-index: 20;
        }

        .pin::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulse-radar 2s infinite ease-out;
        }

        @keyframes pulse-radar {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(3.2); opacity: 0; }
        }

        .pin[data-zone="A"] { background-color: var(--zone-a); }
        .pin[data-zone="B"] { background-color: var(--zone-b); }
        .pin[data-zone="C"] { background-color: var(--zone-c); }

        /* 2. Bottom Sheet */
        #bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--tg-bg-color);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -6px 30px rgba(0,0,0,0.2);
            padding: 20px 20px max(24px, env(safe-area-inset-bottom));
            transform: translateY(115%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 80vh;
            overflow-y: auto;
        }

        #bottom-sheet.open {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background: #d1d1d6;
            border-radius: 2px;
            margin: -8px auto 6px auto;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .unit-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 2px; }
        .unit-id { font-size: 0.8rem; color: var(--tg-hint-color); font-family: monospace; }

        .zone-badge {
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(0,0,0,0.03);
            padding: 12px;
            border-radius: 12px;
        }

        .stat-item span:first-child { 
            display: block; 
            font-size: 0.65rem; 
            color: var(--tg-hint-color); 
            text-transform: uppercase; 
            margin-bottom: 2px; 
        }
        .stat-item span:last-child { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 600; 
        }
        .stat-item.full-width { grid-column: span 2; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }

        button.ui-btn {
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.ui-btn:active { transform: scale(0.98); }

        .btn-mockup {
            background: #2c2c2e;
            color: #ffffff;
        }

        .btn-select {
            background: var(--tg-button-color);
            color: var(--tg-button-text-color);
        }

        .btn-select.selected {
            background: #34c759;
        }

        /* 3. Mockup Overlay Engine */
        #mockup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            flex-direction: column;
        }

        .mockup-header {
            width: 100%;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 20, 0.8);
            color: #ffffff;
            z-index: 10;
        }

        .mockup-header label {
            background: var(--tg-button-color);
            color: var(--tg-button-text-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .mockup-close {
            background: rgba(255,255,255,0.2);
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .mockup-stage {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        #mockup-container {
            position: relative;
            display: inline-block;
        }

        #mockup-bg {
            display: block;
            max-width: 100vw;
            max-height: 82vh;
            pointer-events: none;
        }

        #mockup-ad-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100px;
            height: 100px;
            transform-origin: 0 0;
            pointer-events: none;
            overflow: hidden;
            background: rgba(0, 122, 255, 0.25);
        }

        #mockup-ad-img {
            width: 100%;
            height: 100%;
            display: none;
            object-fit: fill;
        }

        #mockup-lighting {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.05) 45%, rgba(0,0,0,0.15) 60%, rgba(0,0,0,0.3) 100%);
            mix-blend-mode: hard-light;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Main Viewport (Map Pan/Zoom) -->
    <div id="viewport">
        <div id="map-container">
            <img id="map-img" src="Airport_terminal_architectural_s…_2K_20261019151423.jpg" alt="Terminal Map">

        </div>

    <!-- Bottom Sheet Details -->
    <div id="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <div>
                <div class="unit-title" id="bs-title">--</div>
                <div class="unit-id" id="bs-id">--</div>

        <div class="btn-group">

            <button class="ui-btn btn-select" id="btn-toggle-select" onclick="App.toggleSelection()">
                Add to Booking Inquiry
            </button>
        </div>
    </div>

    <!-- Mockup Perspective Canvas Overlay -->
    <div id="mockup-overlay">
        <div class="mockup-header">
            <div>
                <span id="mockup-title" style="font-size: 0.9rem; font-weight: bold; margin-right: 10px;">Mockup Engine</span>
                <label for="ad-file-input">Upload Media</label>
                <input type="file" id="ad-file-input" accept="image/*" style="display: none;" onchange="App.handleUpload(event)">
            </div>
            <button class="mockup-close" onclick="App.closeMockup()">Close</button>
        </div>
        <div class="mockup-stage">
            <div id="mockup-container">
                <img id="mockup-bg" alt="Location Plate">
                <div id="mockup-ad-wrapper">
                    <img id="mockup-ad-img" alt="Uploaded Ad">
                    <div id="mockup-lighting"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Consolidated Master Architecture
         */
        const App = (function() {
            // Master Inventory Dataset (Chat 1 + Chat 2 Geometry)
            const inventory = [
                {
                    id: "APT-T1-CHK-LB01",
                    zone: "A",
                    name: "Main Ticketing Concourse North Lightbox",

                    }
                },
                {

                    style: "Dynamic 15-second loop, bold kinetic typography, luxury corporate",
                    pin: { x: 19.4, y: 40.5 },
                    surface: null
                },
                {
                    id: "APT-T1-AIR-DOOH03",
                    zone: "B",
                    name: "Luxury Plaza Overhead Spectacular",
                    format: "DOOH Screen",
                    footfall: "94,000/day",
                    dwell: "1,250s",
                    peak: "11:00 - 15:30",
                    res: "3840x2160 (16:9)",
                    style: "Ultra-HD cinematic video, 3D anamorphic depth illusions, luxury retail",
                    pin: { x: 55.8, y: 38.2 },
                    surface: {
                        image: "Airport_shopping_galleria_digita…_2K_20261019151608.jpg",
                        corners: {
                            tl: { x: 34.78, y: 20.12 },
                            tr: { x: 65.19, y: 20.07 },
                            br: { x: 65.73, y: 50.52 },
                            bl: { x: 34.24, y: 50.57 }
                        }
                    }
                },
                {
                    id: "APT-T1-AIR-COL04",
                    zone: "B",
                    name: "Gate Concourse Promenade Column",
                    format: "Digital Column Wrap",
                    footfall: "58,000/day",
                    dwell: "720s",
                    peak: "13:00 - 19:00",
                    res: "1536x3584 (Custom)",
                    style: "Seamless portrait looping animation, vertical-first fashion creative",
                    pin: { x: 70.8, y: 53.6 },
                    surface: null
                },
                {
                    id: "APT-T1-ARR-DOOH05",
                    zone: "C",
                    name: "Baggage Claim Reclaim Totem",
                    format: "DOOH Screen (Vertical Totem)",
                    footfall: "47,000/day",
                    dwell: "1,600s",
                    peak: "16:00 - 21:30",
                    res: "2160x3840 (9:16)",
                    style: "Regional destination campaigns, telecom roaming, ride-hailing app promotions",
                    pin: { x: 38.6, y: 72.8 },
                    surface: {
                        image: "Airport_baggage_reclaim_hall_screen_2K_20261019151720.jpg",
                        corners: {
                            tl: { x: 42.62, y: 20.70 },
                            tr: { x: 57.45, y: 20.70 },
                            br: { x: 57.45, y: 66.86 },
                            bl: { x: 42.62, y: 66.86 }
                        }
                    }
                },
                {
                    id: "APT-T1-ARR-LB06",
                    zone: "C",
                    name: "Customs Exit Welcome Lightbox",
                    format: "Static Lightbox",
                    footfall: "52,000/day",
                    dwell: "210s",
                    peak: "17:00 - 22:30",
                    res: "3840x2160 (16:9)",
                    style: "Punchy static lifestyle visuals, local hospitality branding",
                    pin: { x: 50.4, y: 79.2 },
                    surface: null
                }
            ];

            let activeUnit = null;
            const selectedUnits = new Map(); // id => { hasMockup: boolean }

            // TMA SDK Instance Integration
            const tg = window.Telegram?.WebApp;

            function initTMA() {
                if (tg) {
                    tg.ready();
                    tg.expand();
                    const theme = tg.themeParams || {};
                    const root = document.documentElement;
                    if (theme.bg_color) root.style.setProperty('--tg-bg-color', theme.bg_color);
                    if (theme.text_color) root.style.setProperty('--tg-text-color', theme.text_color);
                    if (theme.button_color) root.style.setProperty('--tg-button-color', theme.button_color);
                    if (theme.button_text_color) root.style.setProperty('--tg-button-text-color', theme.button_text_color);

                    tg.onEvent('mainButtonClicked', submitPayload);
                    tg.onEvent('backButtonClicked', handleNativeBack);
                }
                syncMainButton();
            }

            function syncMainButton() {
                if (!tg) return;
                const count = selectedUnits.size;
                if (count > 0) {
                    tg.MainButton.text = `Request Proposal (${count} Surface${count > 1 ? 's' : ''})`;
                    if (!tg.MainButton.isVisible) tg.MainButton.show();
                } else {
                    if (tg.MainButton.isVisible) tg.MainButton.hide();
                }
            }

            function handleNativeBack() {
                const mockupOverlay = document.getElementById('mockup-overlay');
                const bottomSheet = document.getElementById('bottom-sheet');

                if (mockupOverlay.style.display === 'flex') {
                    closeMockup();
                } else if (bottomSheet.classList.contains('open')) {
                    closeSheet();
                }
            }

            function syncBackButton(visible) {
                if (!tg) return;
                if (visible) tg.BackButton.show();
                else tg.BackButton.hide();
            }

            function submitPayload() {
                if (tg) tg.MainButton.showProgress();

                const payload = {
                    action: "booking_inquiry",
                    timestamp: new Date().toISOString(),
                    user_id: tg?.initDataUnsafe?.user?.id || null,
                    username: tg?.initDataUnsafe?.user?.username || null,
                    selected_inventory: Array.from(selectedUnits.entries()).map(([id, data]) => ({
                        id: id,
                        has_custom_mockup: data.hasMockup
                    }))
                };

                setTimeout(() => {
                    if (tg && tg.initData) {
                        try {
                            tg.sendData(JSON.stringify(payload));
                        } catch (e) {
                            alert(`Submitted Payload:\n\n${JSON.stringify(payload, null, 2)}`);
                            tg.MainButton.hideProgress();
                        }
                    } else {
                        alert(`[Browser Preview] Lead Generated:\n\n${JSON.stringify(payload, null, 2)}`);
                    }
                }, 400);
            }

            // Viewport Pan/Zoom Math
            const vp = document.getElementById('viewport');
            const mapContainer = document.getElementById('map-container');
            const vState = { scale: 1, x: 0, y: 0, isDragging: false, sx: 0, sy: 0, initialDist: null, initialScale: 1 };
            const MAP_W = 2000, MAP_H = 1125;

            function applyMapTransform() {
                mapContainer.style.transform = `translate3d(${vState.x}px, ${vState.y}px, 0) scale(${vState.scale})`;
                document.documentElement.style.setProperty('--map-scale', vState.scale);
            }

            function clampMap() {
                const rect = vp.getBoundingClientRect();
                const curW = MAP_W * vState.scale;
                const curH = MAP_H * vState.scale;

                if (curW < rect.width) vState.x = (rect.width - curW) / 2;
                else vState.x = Math.max(rect.width - curW, Math.min(0, vState.x));

                if (curH < rect.height) vState.y = (rect.height - curH) / 2;
                else vState.y = Math.max(rect.height - curH, Math.min(0, vState.y));
            }

            function initMapEngine() {
                // Initial Zoom & Center
                const rect = vp.getBoundingClientRect();
                vState.scale = Math.max(rect.width / MAP_W, rect.height / MAP_H) * 1.1;
                vState.scale = Math.max(0.4, Math.min(2.5, vState.scale));
                vState.x = (rect.width - (MAP_W * vState.scale)) / 2;
                vState.y = (rect.height - (MAP_H * vState.scale)) / 2;
                clampMap();
                applyMapTransform();

                // Mouse events
                vp.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.pin')) return;
                    vState.isDragging = true;
                    vState.sx = e.clientX - vState.x;
                    vState.sy = e.clientY - vState.y;
                });
                window.addEventListener('mousemove', (e) => {
                    if (!vState.isDragging) return;
                    vState.x = e.clientX - vState.sx;
                    vState.y = e.clientY - vState.sy;
                    clampMap();
                    requestAnimationFrame(applyMapTransform);
                });
                window.addEventListener('mouseup', () => vState.isDragging = false);

                // Wheel
                vp.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const xs = (e.clientX - vState.x) / vState.scale;
                    const ys = (e.clientY - vState.y) / vState.scale;
                    vState.scale += -e.deltaY * 0.003;
                    vState.scale = Math.max(0.4, Math.min(2.5, vState.scale));
                    vState.x = e.clientX - xs * vState.scale;
                    vState.y = e.clientY - ys * vState.scale;
                    clampMap();
                    requestAnimationFrame(applyMapTransform);
                }, { passive: false });

                // Touch (Pinch/Pan)
                vp.addEventListener('touchstart', (e) => {
                    if (e.target.closest('.pin')) return;
                    if (e.touches.length === 1) {
                        vState.isDragging = true;
                        vState.sx = e.touches[0].clientX - vState.x;
                        vState.sy = e.touches[0].clientY - vState.y;
                    } else if (e.touches.length === 2) {
                        vState.isDragging = false;
                        vState.initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                        vState.initialScale = vState.scale;
                    }
                });

                vp.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1 && vState.isDragging) {
                        vState.x = e.touches[0].clientX - vState.sx;
                        vState.y = e.touches[0].clientY - vState.sy;
                        clampMap();
                        requestAnimationFrame(applyMapTransform);
                    } else if (e.touches.length === 2) {
                        e.preventDefault();
                        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                        const ratio = dist / vState.initialDist;
                        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                        const xs = (cx - vState.x) / vState.scale;
                        const ys = (cy - vState.y) / vState.scale;

                        vState.scale = Math.max(0.4, Math.min(2.5, vState.initialScale * ratio));
                        vState.x = cx - xs * vState.scale;
                        vState.y = cy - ys * vState.scale;
                        clampMap();
                        requestAnimationFrame(applyMapTransform);
                    }
                }, { passive: false });

                vp.addEventListener('touchend', (e) => {
                    if (e.touches.length === 0) vState.isDragging = false;
                });

                // Dismiss Sheet when tapping empty map
                vp.addEventListener('click', (e) => {
                    if (e.target.id === 'viewport' || e.target.id === 'map-img') closeSheet();
                });
            }

            // Render Pins
            function renderPins() {
                inventory.forEach(unit => {
                    const pin = document.createElement('div');
                    pin.className = 'pin';
                    pin.dataset.id = unit.id;
                    pin.dataset.zone = unit.zone;
                    pin.style.left = `${unit.pin.x}%`;
                    pin.style.top = `${unit.pin.y}%`;

                    pin.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openSheet(unit);
                    });
                    mapContainer.appendChild(pin);
                });
            }

            // Bottom Sheet Controller
            const sheet = document.getElementById('bottom-sheet');
            function openSheet(unit) {
                activeUnit = unit;
                document.querySelectorAll('.pin').forEach(p => p.classList.toggle('active', p.dataset.id === unit.id));

                document.getElementById('bs-title').innerText = unit.name;
                document.getElementById('bs-id').innerText = unit.id;
                
                const badge = document.getElementById('bs-badge');
                badge.innerText = `Zone ${unit.zone}`;
                badge.style.backgroundColor = `var(--zone-${unit.zone.toLowerCase()})`;

                document.getElementById('bs-metrics').innerText = `${unit.footfall} | Dwell: ${unit.dwell} | Peak: ${unit.peak}`;
                document.getElementById('bs-format').innerText = unit.format;
                document.getElementById('bs-res').innerText = unit.res;
                document.getElementById('bs-style').innerText = unit.style;

                // Adjust Mockup button availability
                const mockupBtn = document.getElementById('btn-trigger-mockup');
                if (unit.surface) {
                    mockupBtn.style.display = 'block';
                } else {
                    mockupBtn.style.display = 'none'; // No 3D projection plate available for this unit
                }

                syncSelectBtnState();
                sheet.classList.add('open');
                syncBackButton(true);
            }

            function closeSheet() {
                sheet.classList.remove('open');
                document.querySelectorAll('.pin').forEach(p => p.classList.remove('active'));
                activeUnit = null;
                syncBackButton(false);
            }

            function toggleSelection() {
                if (!activeUnit) return;
                if (selectedUnits.has(activeUnit.id)) {
                    selectedUnits.delete(activeUnit.id);
                } else {
                    selectedUnits.set(activeUnit.id, { hasMockup: false });
                }
                syncSelectBtnState();
                syncMainButton();
            }

            function syncSelectBtnState() {
                const btn = document.getElementById('btn-toggle-select');
                if (activeUnit && selectedUnits.has(activeUnit.id)) {
                    btn.classList.add('selected');
                    btn.innerText = '✓ Selected in Proposal';
                } else {
                    btn.classList.remove('selected');
                    btn.innerText = 'Add to Booking Inquiry';
                }
            }

            // Mockup Homography Engine
            const mockupOverlay = document.getElementById('mockup-overlay');
            const mockupBg = document.getElementById('mockup-bg');
            const adWrapper = document.getElementById('mockup-ad-wrapper');
            const adImg = document.getElementById('mockup-ad-img');

            function launchMockup() {
                if (!activeUnit || !activeUnit.surface) return;
                document.getElementById('mockup-title').innerText = activeUnit.id;
                mockupBg.src = activeUnit.surface.image;

                mockupOverlay.style.display = 'flex';
                syncBackButton(true);

                if (mockupBg.complete) computeHomography();
                else mockupBg.onload = computeHomography;

                window.addEventListener('resize', computeHomography);
            }

            function closeMockup() {
                mockupOverlay.style.display = 'none';
                window.removeEventListener('resize', computeHomography);
                if (activeUnit) syncBackButton(true); // Return to active sheet state
                else syncBackButton(false);
            }

            function handleUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    adImg.src = e.target.result;
                    adImg.style.display = 'block';
                    adWrapper.style.background = 'transparent';

                    // Track mockup creation state
                    if (activeUnit && selectedUnits.has(activeUnit.id)) {
                        selectedUnits.get(activeUnit.id).hasMockup = true;
                    }
                    computeHomography();
                };
                reader.readAsDataURL(file);
            }

            function computeHomography() {
                if (!activeUnit || !activeUnit.surface) return;
                const cw = mockupBg.clientWidth;
                const ch = mockupBg.clientHeight;
                if (cw === 0 || ch === 0) return;

                const c = activeUnit.surface.corners;
                const x0 = (c.tl.x / 100) * cw, y0 = (c.tl.y / 100) * ch;
                const x1 = (c.tr.x / 100) * cw, y1 = (c.tr.y / 100) * ch;
                const x2 = (c.br.x / 100) * cw, y2 = (c.br.y / 100) * ch;
                const x3 = (c.bl.x / 100) * cw, y3 = (c.bl.y / 100) * ch;

                const dx1 = x1 - x2, dx2 = x3 - x2, sx = x0 - x1 + x2 - x3;
                const dy1 = y1 - y2, dy2 = y3 - y2, sy = y0 - y1 + y2 - y3;

                const det = (dx1 * dy2 - dy1 * dx2) || 0.00001;
                const g = (sx * dy2 - sy * dx2) / det;
                const h = (dx1 * sy - dy1 * sx) / det;

                const a = x1 - x0 + g * x1;
                const b = x3 - x0 + h * x3;
                const d = y1 - y0 + g * y1;
                const e = y3 - y0 + h * y3;

                const W = 100, H = 100;
                adWrapper.style.transform = `matrix3d(
                    ${a/W}, ${d/W}, 0, ${g/W},
                    ${b/H}, ${e/H}, 0, ${h/H},
                    0,      0,      1, 0,
                    ${x0},  ${y0},  0, 1
                )`;
            }

            return {
                init: () => {
                    initMapEngine();
                    renderPins();
                    initTMA();
                },
                launchMockup,
                closeMockup,
                closeSheet,
                toggleSelection,
                handleUpload
            };
        })();

        document.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
</html>
